# myna 配置示例。复制到 ~/.config/myna/config.toml 后按需修改。
# 所有字段都可省略，省略即用默认值。

[asr]
# 模型档位（最准 → 最快）：large-v3 | large-v2 | medium | small | base | tiny
# GPU 上 large-v3 与 medium 同为 0.7s 转写，默认即最准；turbo 更快但精度略降
# 也可以直接写任意 HuggingFace 模型名，如 "Systran/faster-whisper-medium"
model = "large-v3"
fallback_model = "small"    # GPU 不可用时的回退档
device = "auto"             # auto | cuda | cpu
language = "zh"
# 这句不是可选优化：实测它同时解决了 whisper 中文输出繁体、以及小模型的误识
initial_prompt = "以下是简体中文的句子。"
beam_size = 5
vad_filter = true           # 滤掉静音段，减少 whisper 在无声处的幻听

[audio]
max_seconds = 120           # 录这么久还没停就自动收尾，防止忘关
min_seconds = 0.3           # 比这还短判为误触，静默丢弃

[inject]
method = "clipboard"        # clipboard（推荐）| type（逐字符，中文不可靠）
paste_key = "shift+insert"  # 默认通用键：终端和普通输入框都认，不用来回切
                            # 也可以固定成 "ctrl+v"（输入框）或 "ctrl+shift+v"（终端）
                            # 托盘菜单「粘贴方式」可随时一键切换，会写回这里
restore_clipboard = true    # 粘贴后把你原来的剪贴板内容还回去
                            # 用 shift+insert 时，鼠标选中区（PRIMARY）也一并还原

# 按窗口类单独指定粘贴键。
# 注意：实测 Wayland 下**拿不到**焦点窗口是谁（GNOME Introspect 返回 AccessDenied，
# xdotool 也看不见原生 Wayland 窗口），所以这段在 Wayland 上基本是死配置，
# 只对 XWayland 应用偶尔生效。终端场景请用托盘菜单切 paste_key。
[inject.paste_key_by_app]
"org.gnome.Console" = "ctrl+shift+v"

[tray]
enabled = true              # 顶栏状态图标。缺 GTK/AppIndicator 会自动跳过，不影响主功能

[postprocess]
to_simplified = true        # 繁转简兜底，需要 opencc；没装则自动跳过
strip = true

# 热词表：把反复听错的词强制改回来。左边是错的，右边是对的。
[hotwords]
"三步" = "散步"
