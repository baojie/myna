<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- myna 八哥：琥珀底 + 八哥头侧影（冠羽、张开的喙）+ 声波，象征「会学舌」 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFD264"/>
      <stop offset="1" stop-color="#E79A22"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)"/>

  <g fill="#16181C">
    <!-- 头 + 颈 -->
    <path d="M104 56
      c33 0 58 24 58 55
      c0 10 -2 19 -7 27
      l0 0
      c-7 11 -11 20 -11 32
      l0 34
      c0 9 -7 16 -16 16
      l-36 0
      c-9 0 -16 -7 -16 -16
      l0 -35
      c0 -13 -4 -22 -12 -32
      c-9 -11 -14 -24 -14 -39
      c0 -25 22 -42 47 -42 z"/>
    <!-- 冠羽 -->
    <path d="M84 62 c-9 -13 -7 -26 5 -35 c-2 13 2 22 12 28 z"/>
    <path d="M107 54 c-4 -15 1 -26 14 -31 c-6 12 -4 21 4 28 z"/>
    <!-- 上喙 -->
    <path d="M158 96 l66 10 l-64 12 c-5 -7 -6 -15 -2 -22 z"/>
    <!-- 下喙（与上喙留一道底色缝，张口说话的样子） -->
    <path d="M158 126 l50 8 l-48 12 c-6 -6 -7 -14 -2 -20 z"/>
  </g>

  <!-- 眼：底色圈 + 黑瞳，八哥眼周本就有黄斑 -->
  <circle cx="126" cy="92" r="15" fill="#FFE08A"/>
  <circle cx="128" cy="92" r="8" fill="#16181C"/>
  <circle cx="131" cy="88" r="2.6" fill="#FFFFFF"/>

  <!-- 声波：说出去的话 -->
  <g fill="none" stroke="#16181C" stroke-linecap="round">
    <path d="M206 156 a30 30 0 0 0 8 -22" stroke-width="12"/>
    <path d="M218 182 a56 56 0 0 0 14 -46" stroke-width="12" opacity="0.5"/>
  </g>
</svg>
